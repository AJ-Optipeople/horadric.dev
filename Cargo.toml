[workspace]
resolver = "2"
members = ["crates/horadric-core", "crates/horadric-link", "crates/horadric-memory", "crates/horadric-hooks", "crates/horadric-pty", "crates/horadric-ui", "crates/horadric"]

[workspace.package]
version = "0.32.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Mopra/horadric.dev"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
