[package]
name = "horadric-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cluster windows for Horadric: Win32, Direct2D and DirectWrite, nothing in between"

[dependencies]
horadric-core = { path = "../horadric-core" }
horadric-hooks = { path = "../horadric-hooks" }
alacritty_terminal = { version = "0.26", default-features = false }
serde_json = { workspace = true }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[target.'cfg(windows)'.dependencies]
horadric-pty = { path = "../horadric-pty" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"
