<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote screen</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #101114; color: #d8d8dc;
    font: 13px "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 30px; display: flex;
    align-items: center; gap: 10px; padding: 0 10px; background: #1a1b20;
    border-bottom: 1px solid #2a2b31; z-index: 2; white-space: nowrap; }
  #state { min-width: 90px; color: #9a9aa2; }
  #state.live { color: #7fc77f; }
  #state.lost { color: #e07a6a; }
  #notice { color: #e0a86a; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  button { font: inherit; color: #d8d8dc; background: #26272e; border: 1px solid #3a3b44;
    border-radius: 4px; padding: 2px 10px; cursor: pointer; }
  button.on { background: #7a3a2a; border-color: #c0603e; color: #fff; }
  #sessions { display: flex; gap: 6px; overflow: hidden; flex: 1; }
  .s { padding: 1px 8px; border-radius: 10px; background: #22232a; color: #a8a8b0; }
  .s.waiting { background: #6a4a12; color: #ffd98a; }
  #zoom { display: flex; gap: 2px; align-items: center; }
  #zoom button { padding: 2px 7px; }
  #level { min-width: 38px; text-align: center; color: #9a9aa2; }
  select { font: inherit; color: #d8d8dc; background: #26272e; border: 1px solid #3a3b44;
    border-radius: 4px; padding: 1px 4px; }
  #stage { position: fixed; top: 31px; left: 0; right: 0; bottom: 0; overflow: auto; }
  /* Auto margins centre the picture while it is smaller than the stage and
     fall to nothing once it is larger, so scrolling reaches every edge
     instead of clipping the far side of a centred box. */
  #pad { display: flex; min-width: 100%; min-height: 100%; width: max-content; }
  #screen { display: block; margin: auto; user-select: none; -webkit-user-drag: none; }
  /* At fit nothing overflows, and a scrollbar from rounding would shrink
     the room the fit was worked out for. */
  #stage.fit { overflow: hidden; }
  #stage.pan { cursor: grab; }
  #stage.panning { cursor: grabbing; }
  #stage.control #screen { cursor: crosshair; outline: 2px solid #c0603e; }
</style>
</head>
<body>
<div id="bar">
  <span id="state">Connecting</span>
  <button id="control" title="Send mouse and keyboard to the remote. Esc twice stops.">Take control</button>
  <span id="zoom">
    <button id="out" title="Zoom out (Ctrl+wheel while not in control)">-</button>
    <span id="level">Fit</span>
    <button id="in" title="Zoom in (Ctrl+wheel while not in control)">+</button>
    <button id="one" title="Switch between fitting the tab and one remote pixel per screen pixel">1:1</button>
  </span>
  <select id="res" hidden title="The remote machine's own screen resolution"></select>
  <span id="notice"></span>
  <div id="sessions"></div>
</div>
<div id="stage"><div id="pad"><img id="screen" alt=""></div></div>
<script>
"use strict";
// The token leaves the address at once: the tab's URL is shown to
// whoever reads the pane, the agent included. This tab keeps it for its
// own requests, and a reload finds it again.
const TOKEN_KEY = "horadric-screen-token";
let token = new URLSearchParams(location.search).get("t");
try {
  if (token) sessionStorage.setItem(TOKEN_KEY, token);
  else token = sessionStorage.getItem(TOKEN_KEY);
} catch (e) { /* storage refused: the token still lives in this page */ }
token = token || "";
if (location.search) history.replaceState(null, "", location.pathname + location.hash);
const q = "t=" + encodeURIComponent(token);
const img = document.getElementById("screen");
const stage = document.getElementById("stage");
const stateEl = document.getElementById("state");
const button = document.getElementById("control");
const list = document.getElementById("sessions");
const noticeEl = document.getElementById("notice");
const levelEl = document.getElementById("level");
const oneButton = document.getElementById("one");
const resEl = document.getElementById("res");

// The virtual screen the last frame showed, in its physical pixels.
let screen = { left: 0, top: 0, width: 0, height: 0 };
let control = false;
let shown = null;

function setState(text, cls) {
  stateEl.textContent = text;
  stateEl.className = cls || "";
}

// About five frames a second: the next fetch goes once the last picture
// is in, so a slow link gets fewer frames, never a queue of them.
const FRAME_MS = 200;
async function poll() {
  const began = performance.now();
  try {
    const r = await fetch("/frame.jpg?" + q + "&w=" + wanted(), { cache: "no-store" });
    if (r.status === 403) { setState("Wrong token", "lost"); return; }
    if (!r.ok) throw new Error(r.status);
    const was = screen;
    screen = {
      left: +r.headers.get("X-Screen-Left") || 0,
      top: +r.headers.get("X-Screen-Top") || 0,
      width: +r.headers.get("X-Screen-Width") || 0,
      height: +r.headers.get("X-Screen-Height") || 0,
    };
    const url = URL.createObjectURL(await r.blob());
    await new Promise((done) => { img.onload = img.onerror = done; img.src = url; });
    if (shown) URL.revokeObjectURL(shown);
    shown = url;
    if (screen.width !== was.width || screen.height !== was.height) {
      layout();
      // Changed over there, by the list below or by someone at the machine.
      if (was.width) loadDisplay();
    }
    setState(control ? "In control" : "Watching", "live");
    setTimeout(poll, Math.max(0, FRAME_MS - (performance.now() - began)));
  } catch (e) {
    setState("Lost, retrying", "lost");
    setTimeout(poll, 1000);
  }
}

// Zoom counts remote pixels per device pixel of this screen: at 1 each
// pixel over there is one pixel here, which is as sharp as it gets.
const ZOOMS = [0.5, 0.75, 1, 1.5, 2];
const ZOOM_KEY = "horadric-screen-zoom";
let zoom = "fit";
try {
  const saved = localStorage.getItem(ZOOM_KEY);
  if (saved && ZOOMS.includes(+saved)) zoom = +saved;
} catch (e) { /* storage refused: start at fit */ }

function ratio() { return window.devicePixelRatio || 1; }

// The zoom at which the whole screen just fits the stage, both ways: a
// wide tab is often limited by its height, not its width.
function fitZoom() {
  if (!screen.width || !screen.height) return 1;
  const css = Math.min(stage.clientWidth / screen.width, stage.clientHeight / screen.height);
  return css * ratio();
}

function current() { return zoom === "fit" ? fitZoom() : zoom; }

// The picture is given its size outright. Left at its natural size, a
// frame fetched smaller than the stage (the first, or one during a resize)
// would stay small, and one in device pixels would show too large.
function layout() {
  if (screen.width && screen.height) {
    const css = current() / ratio();
    img.style.width = screen.width * css + "px";
    img.style.height = screen.height * css + "px";
  }
  levelEl.textContent = zoom === "fit" ? "Fit" : Math.round(zoom * 100) + "%";
  oneButton.textContent = zoom === "fit" ? "1:1" : "Fit";
  stage.classList.toggle("fit", zoom === "fit");
  stage.classList.toggle("pan", !control && zoom !== "fit");
}

// The frame width that fills the picture's device pixels exactly: any
// fewer and the browser stretches it soft, any more is sent for nothing.
function wanted() {
  if (!screen.width) return Math.max(16, Math.round(stage.clientWidth * ratio()));
  return Math.max(16, Math.min(screen.width, Math.round(screen.width * current())));
}

// Changes the zoom keeping the point at (x, y) of the stage where it is.
function setZoom(next, x, y) {
  if (x === undefined) { x = stage.clientWidth / 2; y = stage.clientHeight / 2; }
  const before = img.getBoundingClientRect();
  const box = stage.getBoundingClientRect();
  const fx = before.width ? (box.left + x - before.left) / before.width : 0.5;
  const fy = before.height ? (box.top + y - before.top) / before.height : 0.5;
  zoom = next;
  try { localStorage.setItem(ZOOM_KEY, String(zoom)); } catch (e) { /* kept for this page only */ }
  layout();
  stage.scrollLeft = img.offsetLeft + fx * img.offsetWidth - x;
  stage.scrollTop = img.offsetTop + fy * img.offsetHeight - y;
}

// One step along the levels, with fit standing at its own place among them.
function step(up, x, y) {
  const fit = fitZoom();
  const at = current();
  const near = (a, b) => Math.abs(a - b) < 0.01;
  const levels = ZOOMS.filter((z) => !near(z, fit)).concat([fit]).sort((a, b) => a - b);
  const next = up
    ? levels.find((z) => z > at + 0.001)
    : levels.slice().reverse().find((z) => z < at - 0.001);
  if (next === undefined) return;
  setZoom(next === fit ? "fit" : next, x, y);
}

document.getElementById("in").addEventListener("click", (e) => { step(true); e.currentTarget.blur(); });
document.getElementById("out").addEventListener("click", (e) => { step(false); e.currentTarget.blur(); });
oneButton.addEventListener("click", () => { setZoom(zoom === "fit" ? 1 : "fit"); oneButton.blur(); });
window.addEventListener("resize", layout);

// Ctrl+wheel zooms the picture while the remote is only watched. In control
// it belongs to the remote (zoom in its own apps), and the buttons remain.
stage.addEventListener("wheel", (e) => {
  if (!e.ctrlKey) return;
  // Never the pane's own zoom, in control or not: it would change the
  // picture's size under the sums above.
  e.preventDefault();
  if (control || !e.deltaY) return;
  const box = stage.getBoundingClientRect();
  step(e.deltaY < 0, e.clientX - box.left, e.clientY - box.top);
}, { passive: false });

// Dragging pans a picture larger than the stage, while not in control.
let panning = null;
stage.addEventListener("mousedown", (e) => {
  if (control || e.button !== 0 || zoom === "fit") return;
  e.preventDefault();
  panning = { x: e.clientX, y: e.clientY, left: stage.scrollLeft, top: stage.scrollTop };
  stage.classList.add("panning");
});
window.addEventListener("mousemove", (e) => {
  if (!panning) return;
  stage.scrollLeft = panning.left - (e.clientX - panning.x);
  stage.scrollTop = panning.top - (e.clientY - panning.y);
});
window.addEventListener("mouseup", () => {
  if (!panning) return;
  panning = null;
  stage.classList.remove("panning");
});

// The remote's own resolution. An older server has no /display, and then
// the list stays hidden.
let modes = [];
const modeName = (m) => m.width + " × " + m.height;
async function loadDisplay() {
  try {
    const r = await fetch("/display?" + q, { cache: "no-store" });
    if (r.status === 404) { resEl.hidden = true; return; }
    if (!r.ok) return;
    const d = await r.json();
    const cur = d.current;
    const same = (m) => cur && m.width === cur.width && m.height === cur.height;
    modes = (d.modes || []).slice();
    if (cur && !modes.some(same)) modes.unshift(cur);
    resEl.replaceChildren(...modes.map((m, i) => {
      const o = document.createElement("option");
      o.value = String(i);
      o.textContent = modeName(m);
      o.selected = same(m);
      return o;
    }));
    resEl.hidden = !modes.length;
  } catch (e) { /* the frame loop already says the link is down */ }
}
resEl.addEventListener("change", async () => {
  const m = modes[+resEl.value];
  resEl.blur();
  if (!m) return;
  const sure = window.confirm("This changes the remote machine's own screen resolution to "
    + modeName(m) + ", for anyone using it there too. Change it?");
  if (sure) {
    try {
      const r = await fetch("/display?" + q, {
        method: "POST", body: JSON.stringify({ width: m.width, height: m.height }),
      });
      if (!r.ok) notice((await r.text()) || "the remote refused the resolution (" + r.status + ")");
    } catch (e) { notice("the resolution change did not reach the remote"); }
  }
  // Also puts the list back on the resolution in use when it was refused
  // or called off.
  loadDisplay();
});

async function sessions() {
  try {
    const r = await fetch("/sessions?" + q, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const rows = await r.json();
    list.replaceChildren(...rows.map((s) => {
      const el = document.createElement("span");
      el.className = "s" + (s.waiting !== null ? " waiting" : "");
      el.textContent = s.name + " · " + s.state;
      el.title = s.project + (s.waiting ? "\n" + s.waiting : "");
      return el;
    }));
  } catch (e) { /* the frame loop already says the link is down */ }
}

// Why the remote refused an input, shown for a few seconds.
let noticeTimer = null;
function notice(text) {
  noticeEl.textContent = text;
  noticeEl.title = text;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { noticeEl.textContent = ""; noticeEl.title = ""; }, 5000);
}

// Events go one at a time, each once the one before is answered: separate
// requests may arrive in any order, and an up before its down leaves a
// button held over there. A move waiting at the end is replaced by a newer
// one, since only where the pointer ends up matters; nothing else is
// dropped.
const outbox = [];
let sending = false;
function post(event) {
  if (!control) return;
  const last = outbox[outbox.length - 1];
  if (event.kind === "move" && last && last.kind === "move") outbox[outbox.length - 1] = event;
  else outbox.push(event);
  pump();
}
async function pump() {
  if (sending) return;
  sending = true;
  while (outbox.length) {
    const event = outbox.shift();
    try {
      const r = await fetch("/input?" + q, { method: "POST", body: JSON.stringify(event) });
      if (!r.ok) notice((await r.text()) || "the remote refused input (" + r.status + ")");
    } catch (e) { /* the frame loop already says the link is down */ }
  }
  sending = false;
}

// Where on the remote's virtual screen a point of the picture is.
function at(e) {
  const r = img.getBoundingClientRect();
  if (!r.width || !r.height || !screen.width) return null;
  const x = Math.round((e.clientX - r.left) / r.width * screen.width);
  const y = Math.round((e.clientY - r.top) / r.height * screen.height);
  return {
    x: Math.min(Math.max(x, 0), screen.width - 1),
    y: Math.min(Math.max(y, 0), screen.height - 1),
  };
}

const BUTTONS = ["left", "middle", "right"];
const pressed = new Set();   // mouse buttons down on the remote
let lastAt = null;           // the last position sent or about to be
let moveTimer = null, lastMove = null;
img.addEventListener("mousemove", (e) => {
  if (!control) return;
  lastMove = at(e);
  if (lastMove) lastAt = lastMove;
  // At most one move each 40 ms; the last one always goes.
  if (moveTimer) return;
  moveTimer = setTimeout(() => {
    moveTimer = null;
    if (lastMove) post({ kind: "move", ...lastMove });
  }, 40);
});
img.addEventListener("mousedown", (e) => {
  if (!control || !BUTTONS[e.button]) return;
  e.preventDefault();
  const p = at(e);
  if (!p) return;
  lastAt = p;
  pressed.add(BUTTONS[e.button]);
  post({ kind: "down", ...p, button: BUTTONS[e.button] });
});
window.addEventListener("mouseup", (e) => {
  if (!control || !BUTTONS[e.button]) return;
  const p = at(e) || lastAt;
  if (!p) return;
  lastAt = p;
  pressed.delete(BUTTONS[e.button]);
  post({ kind: "up", ...p, button: BUTTONS[e.button] });
});
img.addEventListener("wheel", (e) => {
  if (!control) return;
  e.preventDefault();
  const p = at(e);
  if (!p) return;
  lastAt = p;
  // A notch is 120 on Windows and about 100 pixels in a browser.
  const per = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 800 : 1.2;
  const delta = Math.max(-1200, Math.min(1200, Math.round(-e.deltaY * per)));
  if (delta) post({ kind: "wheel", ...p, delta });
}, { passive: false });
document.addEventListener("contextmenu", (e) => { if (control) e.preventDefault(); });

// KeyboardEvent.code to a Windows virtual key. The code names the key's
// place, not its letter, so the remote's own layout decides what it types.
const VK = {
  Backspace: 8, Tab: 9, Enter: 13, NumpadEnter: 13, ShiftLeft: 160, ShiftRight: 161,
  ControlLeft: 162, ControlRight: 163, AltLeft: 164, AltRight: 165, Pause: 19,
  CapsLock: 20, Escape: 27, Space: 32, PageUp: 33, PageDown: 34, End: 35, Home: 36,
  ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, PrintScreen: 44,
  Insert: 45, Delete: 46, MetaLeft: 91, MetaRight: 92, OSLeft: 91, OSRight: 92,
  ContextMenu: 93, NumpadMultiply: 106, NumpadAdd: 107, NumpadSubtract: 109,
  NumpadDecimal: 110, NumpadDivide: 111, NumLock: 144, ScrollLock: 145,
  Semicolon: 186, Equal: 187, Comma: 188, Minus: 189, Period: 190, Slash: 191,
  Backquote: 192, BracketLeft: 219, Backslash: 220, BracketRight: 221, Quote: 222,
  IntlBackslash: 226,
};
for (let i = 0; i < 26; i++) VK["Key" + String.fromCharCode(65 + i)] = 65 + i;
for (let i = 0; i < 10; i++) { VK["Digit" + i] = 48 + i; VK["Numpad" + i] = 96 + i; }
for (let i = 1; i <= 24; i++) VK["F" + i] = 111 + i;

const held = new Set();      // virtual keys down on the remote
const typed = new Set();     // codes whose press went as text, so their release does not go
const ESCAPE = 27;
const ESCAPE_TWICE_MS = 600;
let escapeTimer = null;      // a first Esc held back, in case a second ends control

function sendEscape() {
  post({ kind: "key", vk: ESCAPE, down: true });
  post({ kind: "key", vk: ESCAPE, down: false });
}

function printable(e) {
  // One character, not a name like "Enter"; AltGr makes characters too.
  const one = [...e.key].length === 1;
  const plain = !e.ctrlKey && !e.altKey && !e.metaKey;
  return one && (plain || e.getModifierState("AltGraph"));
}

// Lets go of everything held over there: keys and mouse buttons alike
// would otherwise stay down once input stops coming.
function release() {
  if (escapeTimer) {
    // One Esc pressed and nothing after it: it was meant for the remote.
    clearTimeout(escapeTimer);
    escapeTimer = null;
    sendEscape();
  }
  for (const vk of held) post({ kind: "key", vk, down: false });
  held.clear();
  typed.clear();
  if (lastAt) {
    for (const b of pressed) post({ kind: "up", ...lastAt, button: b });
  }
  pressed.clear();
}

window.addEventListener("keydown", (e) => {
  if (!control) return;
  e.preventDefault();
  const plain = !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey;
  if (e.code === "Escape" && plain) {
    // A plain Esc waits to see whether a second follows, so the two that
    // end control send nothing; its release is not held, so it goes
    // nowhere either.
    if (e.repeat) return;
    if (escapeTimer) {
      clearTimeout(escapeTimer);
      escapeTimer = null;
      setControl(false);
      return;
    }
    escapeTimer = setTimeout(() => { escapeTimer = null; sendEscape(); }, ESCAPE_TWICE_MS);
    return;
  }
  if (printable(e)) {
    if (e.getModifierState("AltGraph")) {
      // AltGr arrives as Ctrl and Alt, and a character typed under them
      // would be a shortcut over there.
      for (const vk of [162, 163, 164, 165]) {
        if (held.delete(vk)) post({ kind: "key", vk, down: false });
      }
    }
    typed.add(e.code);
    post({ kind: "text", text: e.key });
    return;
  }
  if (e.key === "Dead") return;
  const vk = VK[e.code];
  if (!vk) return;
  held.add(vk);
  post({ kind: "key", vk, down: true });
});
window.addEventListener("keyup", (e) => {
  if (!control) return;
  e.preventDefault();
  if (typed.delete(e.code)) return;
  const vk = VK[e.code];
  if (!vk || !held.has(vk)) return;
  held.delete(vk);
  post({ kind: "key", vk, down: false });
});
// A key held when the tab loses focus would stay down over there.
window.addEventListener("blur", release);

function setControl(on) {
  if (!on) release();
  control = on;
  button.classList.toggle("on", on);
  button.textContent = on ? "Release control" : "Take control";
  stage.classList.toggle("control", on);
  layout();
  if (stateEl.className === "live") setState(on ? "In control" : "Watching", "live");
  button.blur();
}
button.addEventListener("click", () => setControl(!control));

layout();
poll();
loadDisplay();
sessions();
setInterval(sessions, 3000);
</script>
</body>
</html>
