[package]
name = "horadric"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Every coding agent session as a tile on your desktop"

[[bin]]
name = "horadric"
path = "src/main.rs"

[[bin]]
name = "horadricw"
path = "src/horadricw.rs"

[dependencies]
horadric-core = { path = "../horadric-core" }
horadric-hooks = { path = "../horadric-hooks" }
horadric-memory = { path = "../horadric-memory" }
horadric-pty = { path = "../horadric-pty" }
horadric-ui = { path = "../horadric-ui" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
