[package]
name = "horadric-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Long term memory for Horadric: text embedded by meaning, with candle"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
horadric-core = { path = "../horadric-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
