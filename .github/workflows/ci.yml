name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The version and components come from rust-toolchain.toml, so CI
      # lints with the same clippy as the machine that committed.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
  # The Mac half is written on Windows and only ever runs here, so this is
  # where its tests and its pseudo terminal meet a real Mac.
  macos:
    runs-on: macos-latest
    # A test that hangs on the Mac would hold a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # One at a time, so a test that hangs is the last one named.
      - run: cargo test --workspace --no-fail-fast -- --test-threads=1
  # Linux is a headless node (`horadric node`), without the tiles or the
  # memory, so only its crates are built. The smoke run is its "verified
  # on screen": a node, a session through it, read over --stdio.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRATES: -p horadric-core -p horadric-hooks -p horadric-pty -p horadric
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo clippy $CRATES --all-targets -- -D warnings
      - run: cargo test $CRATES --no-fail-fast -- --test-threads=1
      # The smoke run says something of its own even when a test failed.
      - if: ${{ !cancelled() }}
        run: cargo build -p horadric
      - if: ${{ !cancelled() }}
        run: bash .github/linux-smoke.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke
          path: linux-smoke
