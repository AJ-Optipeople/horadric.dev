name: Mac release
# A tag builds Horadric.app for both kinds of Mac and attaches
# Horadric-macos.tar.gz (for install.sh) and Horadric-macos.zip (the same
# app, for MacUpdate, which takes only a .pkg, .dmg or .zip) to the draft
# release of that tag. The tar.gz is
# signed for the updater on the Windows machine that holds the key, as
# RELEASING.md says; nothing here can sign it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and attach to, such as v0.17.0
        required: true
permissions:
  contents: write
jobs:
  # One runner per kind of Mac, side by side, so the release waits for one
  # build instead of two in a row.
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: horadric-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/horadric
  pack:
    needs: build
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # No checkout here, so gh cannot read the repository from git.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: horadric-*
      - name: One binary for both
        run: |
          mkdir -p dist
          lipo -create -output dist/horadric \
            horadric-aarch64-apple-darwin/horadric \
            horadric-x86_64-apple-darwin/horadric
          chmod +x dist/horadric
          lipo -info dist/horadric
      - name: Bundle, check and pack
        run: |
          dist/horadric bundle dist/Horadric.app
          codesign --verify --verbose dist/Horadric.app
          plutil -lint dist/Horadric.app/Contents/Info.plist
          dist/Horadric.app/Contents/MacOS/horadric --help >/dev/null
          cd dist && tar -czf Horadric-macos.tar.gz Horadric.app
          ditto -c -k --keepParent Horadric.app Horadric-macos.zip
          shasum -a 256 Horadric-macos.tar.gz Horadric-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Horadric-macos
          path: |
            dist/Horadric-macos.tar.gz
            dist/Horadric-macos.zip
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The draft is made by hand after the tag is pushed, so wait for it.
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/Horadric-macos.tar.gz dist/Horadric-macos.zip --clobber
              exit 0
            fi
            sleep 30
          done
          echo "no release $TAG after 30 minutes; the archive is in this run's artifacts"
